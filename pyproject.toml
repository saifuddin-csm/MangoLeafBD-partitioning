[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mangoleaf"
version = "1.0.0"
description = "Session-aware evaluation of mango leaf disease recognition on MangoLeafBD"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["torch>=2.1", "torchvision>=0.16", "timm>=0.9.12", "scikit-learn>=1.3", "pandas>=2.0",
                "numpy>=1.24", "matplotlib>=3.7", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]
